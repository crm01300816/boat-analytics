name: Evaluate one day from official B and K archives
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/official-backtest-pilot.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Ensure LZH extraction tool
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq 7zip
          fi
      - name: Extract one historical day and match entrants and payouts
        run: |
          python3 scripts/official-backtest-pilot.py --end 2026-10-28 --days 1 --out .local/official-pilot-input.json
      - name: Score current model against actual 3連単 payouts
        run: |
          node --test tests/*.test.mjs
          node scripts/official-backtest-pilot.mjs .local/official-pilot-input.json official-backtest-pilot-report.json
      - name: Delete intermediate race-level inputs
        if: always()
        run: rm -rf .local/official-pilot-input.json
      - name: Store only aggregated score report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-day-official-3rentan-model-evaluation
          path: official-backtest-pilot-report.json
          retention-days: 7
          if-no-files-found: warn
