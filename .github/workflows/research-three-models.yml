name: Pilot three pre-race models on official B/K months
on:
  workflow_dispatch:
  push:
    branches: [experiment/value-ensemble-research-20261030]
    paths:
      - scripts/research-three-models.mjs
      - scripts/sanitize-official-model-input.mjs
      - tests/research-three-models.test.mjs
      - .github/workflows/research-three-models.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression tests
        run: node --test tests/*.test.mjs
  collect:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        month: ['2025-03', '2026-03', '2026-09']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install official LZH extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq 7zip
      - name: Collect one official B/K month
        env:
          MONTH: ${{ matrix.month }}
        run: |
          START="${MONTH}-01"
          END=$(date -d "${START} +1 month -1 day" +%F)
          python3 scripts/official-month-collector.py --start "$START" --end "$END" --out .local/private.json
      - name: Strip racer identity and retain only derived numeric features
        env:
          MONTH: ${{ matrix.month }}
        run: |
          node scripts/sanitize-official-model-input.mjs .local/private.json "official-${MONTH}.json"
          rm -f .local/private.json /tmp/bkm-*.lzh
      - name: Upload temporary anonymous features (one-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: official-feature-${{ matrix.month }}
          path: official-${{ matrix.month }}.json
          retention-days: 1
          if-no-files-found: error
      - name: Remove any remaining private source rows
        if: always()
        run: rm -f .local/private.json /tmp/bkm-*.lzh
  compare:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download anonymous feature files
        uses: actions/download-artifact@v4
        with:
          pattern: official-feature-*
          path: .local/features
          merge-multiple: true
      - name: Train on 2025-03, validate on 2026-03 and evaluate on 2026-09
        env:
          MODEL_RESEARCH_MONTHS: 2025-03,2026-03,2026-09
        run: |
          node scripts/research-three-models.mjs .local/features three-model-pilot.json
          echo "### Three-model retrospective pilot" >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./three-model-pilot.json'); for(const x of r.rows.filter(x=>x.period==='test'&&x.segment==='all'&&x.count===3)) console.log(x.model,x.races,x.provisionalROI)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove per-race derived features
        if: always()
        run: rm -rf .local/features
      - name: Upload aggregate pilot only
        uses: actions/upload-artifact@v4
        with:
          name: official-bk-three-model-pilot-aggregates
          path: three-model-pilot.json
          retention-days: 30
          if-no-files-found: error
