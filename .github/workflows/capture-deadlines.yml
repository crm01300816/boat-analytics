name: Capture daily race deadline times
on:
  workflow_dispatch:
  schedule:
    # UTC times correspond to JST 06:15, 08:15, 11:15, 14:15, 17:15, 20:15.
    - cron: '15 21,23,2,5,8,11 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-deadlines.yml'
      - 'scripts/update-race-deadlines.mjs'
permissions:
  contents: write
  actions: write
concurrency:
  group: deadline-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    # The capture script retries transient Boatcast failures (e.g. early-morning
    # 403s) with backoff for up to ~51 minutes, so allow the job to span that.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Obtain and retain scheduled cutoff times
        run: node scripts/update-race-deadlines.mjs
      - name: Commit published daily cutoff snapshot
        id: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/deadlines/
          if git diff --cached --quiet; then
            echo 'No new cutoff time to publish'
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: retain race cutoff schedule"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo 'Push failed after 5 attempts.' >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy latest cutoff times to GitHub Pages
        if: steps.published.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
