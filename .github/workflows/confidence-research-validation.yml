name: Confidence research validation (research branch)
on:
  push:
    branches:
      - experiment/value-ensemble-research-20261030
    paths:
      - 'scripts/research-confidence*.py'
      - 'scripts/inventory-confidence-cache.py'
      - 'scripts/export-confidence-mass.mjs'
      - 'scripts/report-attack3-36months.py'
      - 'scripts/report-attack3-staking.py'
      - 'scripts/report-top3-reliability.py'
      - 'scripts/report-attack3-chronological-calibration.py'
      - 'scripts/report-attack3-confidence50-periods.py'
      - 'scripts/report-attack3-confidence50-calibration.py'
      - 'scripts/report-attack3-mass-strata.py'
      - 'scripts/report-alternative-consensus.py'
      - 'scripts/audit-alternative-model-input.py'
      - 'scripts/fetch-recent-official-bk.py'
      - 'scripts/audit-recent-official-bk.py'
      - 'scripts/report-recent-paired-coverage.py'
      - 'scripts/report-recent-cache-overlap.py'
      - 'scripts/extract-recent-b-features.py'
      - 'scripts/evaluate-cached-confidence.py'
      - 'tests/test_confidence_calibration*.py'
      - '.github/workflows/confidence-research-validation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  actions: read
jobs:
  confidence-validation:
    if: github.ref == 'refs/heads/experiment/value-ensemble-research-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install confidence test dependencies
        run: python -m pip install numpy scikit-learn lhafile
      - name: Run confidence regression tests
        run: python -m unittest discover -s tests -p 'test_confidence_calibration*.py' -v
      - name: Inventory existing cached inputs and historical artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/inventory-confidence-cache.py
      - name: Find cached holdout predictions and evaluate when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p confidence-research-results
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = [
              Path("data/research/confidence-predictions.json"),
              Path("data/confidence-predictions.json"),
              Path("research/confidence-predictions.json"),
          ]
          found = next((p for p in candidates if p.is_file()), None)
          status = {"input": str(found) if found else None, "status": "ready" if found else "blocked_missing_prediction_level_cache", "note": "36-month aggregate results alone cannot reconstruct race-level probability calibration."}
          Path("confidence-research-results/input-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          if found:
              import subprocess
              subprocess.run(["python", "scripts/research-confidence-calibration.py", "--input", str(found), "--out", "confidence-research-results/holdout-metrics.json", "--test-start", "2026-05-01"], check=True)
          else:
              print("No race-level cached predictions found; metrics not fabricated.")
          PY
      - name: Download existing private research cache via official artifact action
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13381974825'
          run-id: '41955600242'
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: /tmp/confidence-source
      - name: Evaluate saved 36-month research feature cache (no recollection)
        shell: bash
        run: |
          set -euo pipefail
          CACHE_FILE="$(find /tmp/confidence-source -type f -name input.jsonl -print -quit)"
          test -n "$CACHE_FILE" && test -s "$CACHE_FILE"
          trap 'rm -rf /tmp/confidence-source /tmp/confidence-mass.jsonl' EXIT
          node scripts/export-confidence-mass.mjs "$CACHE_FILE" /tmp/confidence-mass.jsonl
          python scripts/evaluate-cached-confidence.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-36months.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-staking.py /tmp/confidence-mass.jsonl
          python scripts/report-top3-reliability.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-confidence50-periods.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-chronological-calibration.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-confidence50-calibration.py /tmp/confidence-mass.jsonl
          python scripts/report-attack3-mass-strata.py /tmp/confidence-mass.jsonl
          python scripts/audit-alternative-model-input.py /tmp/confidence-mass.jsonl
          python scripts/report-alternative-consensus.py /tmp/confidence-mass.jsonl
          python scripts/report-recent-cache-overlap.py /tmp/confidence-mass.jsonl confidence-research-results/recent-cache-overlap.json
          python scripts/audit-boatracecsv-odds.py --predictions /tmp/confidence-mass.jsonl --start 2026-05-01 --end 2026-11-05
      - name: Fetch official recent B/K archives (2026-10-29 through 2026-11-04)
        continue-on-error: true
        run: python scripts/fetch-recent-official-bk.py --start 2026-10-29 --end 2026-11-04 --out /tmp/official-recent-bk
      - name: Inspect recent archive contents
        run: |
          python -m pip install lhafile
          python scripts/audit-recent-official-bk.py
          python scripts/report-recent-paired-coverage.py
          python scripts/extract-recent-b-features.py
      - name: Upload recent official B/K archive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-recent-bk-20261029-20261104
          path: /tmp/official-recent-bk/
          if-no-files-found: warn
      - name: Publish validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confidence-research-validation
          path: confidence-research-results/
          if-no-files-found: warn
