name: Freeze prospective BOATRACE picks before deadline

on:
  schedule:
    # 09:00, 12:00, 15:00, 18:00 JST
    - cron: '0 0,3,6,9 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-prospective.yml

permissions:
  contents: write

concurrency:
  group: boat-daily-trend-history
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check model and date handling
        run: node --test tests/*.test.mjs
      - name: Ensure 7z for official LZH archives
        run: command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Generate today's official programs if the morning run has not
        shell: bash
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          cards="public/data/programs/race_cards/$(TZ=Asia/Tokyo date +%Y/%m/%d).csv"
          if [ ! -f "$cards" ]; then
            node scripts/official-data.mjs programs "$today"
          fi
      - name: Record predictions for unexpired races only
        run: node scripts/capture-prospective.mjs
      - name: Save original picks and capture timestamps
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/prospective/ public/data/
          if git diff --cached --quiet; then
            echo 'No new eligible pre-deadline picks.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze pre-deadline 3rentan picks [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo 'Push failed after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
