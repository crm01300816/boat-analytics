name: Update daily BOATRACE result and wave trends
on:
  schedule:
    # 02:15 JST, after the completed day's final night races
    - cron: '15 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boat-daily-trend-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit test unchanged analysis and daily summary
        run: node --test tests/*.test.mjs
      - name: Update last 3 finished days from publicly available results
        run: node scripts/update-daily-results.mjs public/daily-trends.json 3
      - name: Commit only derived public daily totals
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/daily-trends.json
          if git diff --cached --quiet; then
            echo 'No new completed result data.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily result and wave statistics [skip ci]'
          git push
