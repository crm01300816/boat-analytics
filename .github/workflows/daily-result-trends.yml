name: Update daily BOATRACE result and wave trends
on:
  schedule:
    # Every 3 hours: refresh settled strict-five records and publish updated totals
    - cron: '15 */3 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/daily-result-trends.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: boat-daily-trend-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit test unchanged analysis and daily summary
        run: node --test tests/*.test.mjs
      - name: Ensure 7z for official LZH archives
        run: command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Generate official results for last 3 finished days
        run: node scripts/official-data.mjs results-range 3
      - name: Update last 3 finished days from official results
        run: node scripts/update-daily-results.mjs public/daily-trends.json 3
      - name: Score captured pre-deadline predictions against finished races
        run: node scripts/score-prospective.mjs public/prospective-summary.json 3
      - name: Reconstruct historical selective-five eligibility with frozen-pick cross-check
        run: node scripts/backfill-selective-five.mjs
      - name: Compare frozen predictions across venues, bet counts and chronological periods
        run: node scripts/compare-prospective.mjs
      - name: Commit only derived public daily totals
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- public/daily-trends.json public/prospective-summary.json public/prospective-model-comparison.json public/selective-five-backfill.json public/data/ data/frame-index.json
          if git diff --cached --quiet; then
            echo 'No new completed result data.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update daily result and wave statistics [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo 'Push failed after 5 attempts.' >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          # GITHUB_TOKEN bot pushes do not initiate ordinary push workflows;
          # explicitly publish the regenerated daily summary on Pages.
          gh workflow run pages.yml --ref main
