name: Audit one official BOATRACE week
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/official-week-pilot.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Ensure LZH extraction tool
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq 7zip
          fi
          7z i | head -n 8
      - name: Download and inspect seven dates in sequence
        run: |
          python3 scripts/probe-official-week.py --end 2026-10-28 --days 7 --output official-week-report.json
      - name: Store only the inspection metadata (no raw data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-week-inspection
          path: official-week-report.json
          if-no-files-found: warn
          retention-days: 7
