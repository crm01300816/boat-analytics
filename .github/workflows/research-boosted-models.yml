name: Research LightGBM and XGBoost on 36-month official B/K
on:
  push:
    branches: [experiment/value-ensemble-research-20261030]
    paths:
      - scripts/export-gbm-features.mjs
      - scripts/research-boosted-models.py
      - tests/export-gbm-features.test.mjs
      - tests/test_boosted_models.py
      - .github/workflows/research-boosted-models.yml
      - .github/workflows/research-technique-model.yml
      - scripts/official-k-techniques.py
      - scripts/research-technique-model.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  boosted-36m:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source ML libraries
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'lightgbm>=4.5,<5' 'xgboost>=3,<4' 'scikit-learn>=1.5,<2'
      - name: Regression tests for baseline and both real AI libraries
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_boosted_models.py' -v
      - name: Retrieve 36 anonymous B/K feature months from original successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local/raw .local/features
          gh run download 41372002521 --repo crm01300816/boat-analytics --pattern 'official-feature-36m-*' --dir .local/raw
          find .local/raw -type f -name 'official-20??-??.json' -exec cp {} .local/features/ \;
          test "$(find .local/features -maxdepth 1 -name 'official-20??-??.json' | wc -l)" -eq 36
      - name: Run original purchase-selection benchmark
        run: node scripts/research-race-selection.mjs .local/features boosted-selection-baseline.json
      - name: Prepare temporary anonymized per-race ML features
        run: node scripts/export-gbm-features.mjs .local/features .local/boosted-input.jsonl
      - name: Train and evaluate LightGBM and XGBoost with frozen time splits
        run: |
          python scripts/research-boosted-models.py --input .local/boosted-input.jsonl --out boosted-36m-aggregate.json
          python - <<'PY'
          import json,os
          r=json.load(open('boosted-36m-aggregate.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## LightGBM / XGBoost: 36-month B/K research\n\n')
              f.write('| Model | Test 5-point races | Hit rate | Provisional ROI | Selected races | Selected ROI |\n|---|---:|---:|---:|---:|---:|\n')
              for m in r['models']:
                  c=next(c for c in m['counts'] if c['count']==5)
                  a=c['periods']['test']['ai']
                  s=c['selectedByValidation']
                  n=s['test']['races'] if s else 'none qualified'
                  roi=format(s['test']['provisionalROI'],'.2%') if s and s['test']['provisionalROI'] is not None else '—'
                  f.write(f"| {m['model']} | {a['races']} | {a['hitRate']:.2%} | {a['provisionalROI']:.2%} | {n} | {roi} |\n")
              f.write('\nRetrospective diagnostic only. No verified pre-deadline odds or audited settlements.\n')
          PY
      - name: Delete temporary per-race features
        if: always()
        run: rm -rf .local
      - name: Upload aggregate-only research outputs
        uses: actions/upload-artifact@v4
        with:
          name: official-bk-boosted-36m-aggregates
          path: |
            boosted-36m-aggregate.json
            boosted-selection-baseline.json
          retention-days: 30
          if-no-files-found: error

  technique-36m:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source research tools
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'lightgbm>=4.5,<5' 'xgboost>=3,<4' 'scikit-learn>=1.5,<2'
          sudo apt-get update -qq && sudo apt-get install -y -qq 7zip
      - name: Regression tests (including outcome leakage guards)
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_official_k_techniques.py' -v
          python -m unittest discover -s tests -p 'test_technique_model.py' -v
          python -m unittest discover -s tests -p 'test_boosted_models.py' -v
      - name: Sequentially collect official B/K 36 months with K technique labels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/private
          for MONTH in $(python - <<'PY'
          for y in range(2023,2027):
              for m in range(1,13):
                  label=f'{y}-{m:02d}'
                  if '2023-11'<=label<='2026-10':print(label)
          PY
          ); do
            START="$MONTH-01"
            END=$(date -d "$START +1 month -1 day" +%F)
            if [ "$MONTH" = "2026-10" ]; then END=2026-10-28; fi
            python scripts/official-month-collector.py --start "$START" --end "$END" \
              --include-technique --out ".local/private/official-$MONTH.json"
          done
          test "$(find .local/private -maxdepth 1 -name 'official-20??-??.json' | wc -l)" -eq 36
      - name: Recompute validation-selected purchase-selection baseline
        run: node scripts/research-race-selection.mjs .local/private technique-selection-baseline.json
      - name: Export PRIVATE racer-level chronological features
        run: node scripts/export-technique-input.mjs .local/private .local/technique-input.jsonl
      - name: Train 3-stage LightGBM/XGBoost and compare 3/5/7/10 bets
        run: |
          python scripts/research-technique-model.py \
            --input .local/technique-input.jsonl --out technique-36m-aggregate.json
          python - <<'PY'
          import json,os
          r=json.load(open('technique-36m-aggregate.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Venue × racer × course × technique: 36-month research\n\n')
              f.write(f"Status: **{r['status']}**. K technique coverage: **{r['audit']['techniqueCoverage']:.1%}**.\n\n")
              f.write('| Model | 5-point test races | Hit rate | Provisional ROI | Profit |\n|---|---:|---:|---:|---:|\n')
              for model in r['models']:
                  m=next(x for x in model['counts'] if x['count']==5)['periods']['test']['ai']
                  f.write(f"| {model['model']} | {m['races']} | {m['hitRate']:.2%} | {m['provisionalROI']:.2%} | {m['profitYen']:,} JPY |\n")
              f.write('\nRetrospective diagnostic only; odds and special settlements unaudited.\n')
          PY
      - name: Erase ALL private racer IDs and race-level data
        if: always()
        run: rm -rf .local /tmp/bkm-*.lzh
      - name: Upload aggregate-only research result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-bk-technique-36m-aggregates
          path: |
            technique-36m-aggregate.json
            technique-selection-baseline.json
          retention-days: 30
          if-no-files-found: warn
