name: Probe official BOATRACE archives

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-official-archives.yml

permissions:
  contents: read

jobs:
  probe:
    name: Check official B/K downloads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe two official archive files without retries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          import json
          from datetime import datetime, timezone

          day = "20261028"
          month = day[:6]
          targets = [
              ("B_program", f"https://www1.mbrace.or.jp/od2/B/{month}/b{day[2:]}.lzh"),
              ("K_result", f"https://www1.mbrace.or.jp/od2/K/{month}/k{day[2:]}.lzh"),
          ]
          results = []
          for kind, url in targets:
              item = {"kind": kind, "url": url}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"boat-analytics-availability-probe/1.0"})
                  with urllib.request.urlopen(req, timeout=25) as res:
                      raw = res.read(8_000_001)
                      item.update(http_status=res.status, bytes_read=len(raw),
                                  archive_signature=any(raw[2:7] == m for m in (b"-lh0-", b"-lh1-", b"-lh4-", b"-lh5-", b"-lh6-", b"-lh7-", b"-lzs-")),
                                  truncated=len(raw) > 8_000_000)
              except urllib.error.HTTPError as ex:
                  item.update(http_status=ex.code, error="HTTP error")
              except Exception as ex:
                  item.update(http_status=None, error=type(ex).__name__, detail=str(ex)[:150])
              results.append(item)
              print(json.dumps(item, ensure_ascii=False))
          with open("boatrace-official-probe.json", "w") as f:
              json.dump({"checked_at":datetime.now(timezone.utc).isoformat(),
                         "note":"Network test only; no archive data is published.",
                         "results": results}, f, ensure_ascii=False, indent=2)
          if all(x.get("http_status") == 200 and x.get("archive_signature") for x in results):
              print("Both files downloaded and have an LZH archive signature.")
          else:
              print("At least one archive was not verified. Review status codes; do not claim archive availability.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-archive-connectivity-report
          path: boatrace-official-probe.json
          retention-days: 7
