name: Retrospective consensus B/K 36 months
on:
  workflow_dispatch:
  push:
    branches: [experiment/value-ensemble-research-20261030]
    paths: [.github/workflows/retrospective-consensus-pilot.yml]
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      fail-fast: false
      matrix:
        period:
          - {label: '2023-11', start: '2023-11-01', end: '2023-11-30'}
          - {label: '2023-12', start: '2023-12-01', end: '2023-12-31'}
          - {label: '2024-01', start: '2024-01-01', end: '2024-01-31'}
          - {label: '2024-02', start: '2024-02-01', end: '2024-02-29'}
          - {label: '2024-03', start: '2024-03-01', end: '2024-03-31'}
          - {label: '2024-04', start: '2024-04-01', end: '2024-04-30'}
          - {label: '2024-05', start: '2024-05-01', end: '2024-05-31'}
          - {label: '2024-06', start: '2024-06-01', end: '2024-06-30'}
          - {label: '2024-07', start: '2024-07-01', end: '2024-07-31'}
          - {label: '2024-08', start: '2024-08-01', end: '2024-08-31'}
          - {label: '2024-09', start: '2024-09-01', end: '2024-09-30'}
          - {label: '2024-10', start: '2024-10-01', end: '2024-10-31'}
          - {label: '2024-11', start: '2024-11-01', end: '2024-11-30'}
          - {label: '2024-12', start: '2024-12-01', end: '2024-12-31'}
          - {label: '2025-01', start: '2025-01-01', end: '2025-01-31'}
          - {label: '2025-02', start: '2025-02-01', end: '2025-02-28'}
          - {label: '2025-03', start: '2025-03-01', end: '2025-03-31'}
          - {label: '2025-04', start: '2025-04-01', end: '2025-04-30'}
          - {label: '2025-05', start: '2025-05-01', end: '2025-05-31'}
          - {label: '2025-06', start: '2025-06-01', end: '2025-06-30'}
          - {label: '2025-07', start: '2025-07-01', end: '2025-07-31'}
          - {label: '2025-08', start: '2025-08-01', end: '2025-08-31'}
          - {label: '2025-09', start: '2025-09-01', end: '2025-09-30'}
          - {label: '2025-10', start: '2025-10-01', end: '2025-10-31'}
          - {label: '2025-11', start: '2025-11-01', end: '2025-11-30'}
          - {label: '2025-12', start: '2025-12-01', end: '2025-12-31'}
          - {label: '2026-01', start: '2026-01-01', end: '2026-01-31'}
          - {label: '2026-02', start: '2026-02-01', end: '2026-02-28'}
          - {label: '2026-03', start: '2026-03-01', end: '2026-03-31'}
          - {label: '2026-04', start: '2026-04-01', end: '2026-04-30'}
          - {label: '2026-05', start: '2026-05-01', end: '2026-05-31'}
          - {label: '2026-06', start: '2026-06-01', end: '2026-06-30'}
          - {label: '2026-07', start: '2026-07-01', end: '2026-07-31'}
          - {label: '2026-08', start: '2026-08-01', end: '2026-08-31'}
          - {label: '2026-09', start: '2026-09-01', end: '2026-09-30'}
          - {label: '2026-10', start: '2026-10-01', end: '2026-10-28'}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install LZH extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq 7zip
      - name: Collect official B/K and run historical consensus
        run: |
          python3 scripts/official-month-collector.py --start "${{ matrix.period.start }}" --end "${{ matrix.period.end }}" --out ".local/private.json"
          node scripts/historical-consensus-scan.mjs ".local/private.json" "consensus-${{ matrix.period.label }}.json"
          node scripts/historical-index-grid.mjs ".local/private.json" "index-${{ matrix.period.label }}.json"
          node scripts/historical-axis-strategies.mjs ".local/private.json" "axis-${{ matrix.period.label }}.json"
      - name: Remove private race-level data
        if: always()
        run: rm -f .local/private.json /tmp/bkm-*.lzh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-${{ matrix.period.label }}
          path: |
            consensus-${{ matrix.period.label }}.json
            index-${{ matrix.period.label }}.json
            axis-${{ matrix.period.label }}.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
